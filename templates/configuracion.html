<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - Urbinatti Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#020617] text-[#f4f4f5] min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-[#090d16] border border-[#1e293b] rounded-3xl p-8 space-y-6 shadow-2xl">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-white">Configuración</h1>
                <p class="text-xs text-[#a1a1aa]">Actualiza tus datos y API Key de Gemini.</p>
            </div>
            <a href="/" class="p-2 bg-[#020617] border border-[#1e293b] rounded-xl text-[#a1a1aa] hover:text-white transition-colors text-xs">Volver</a>
        </div>
        
        <form action="/configuracion" method="POST" class="space-y-4">
            <div class="space-y-1">
                <label class="block text-xs font-medium text-[#f4f4f5]">Peso (kg)</label>
                <input type="number" step="0.1" name="peso_kg" required value="{{ user_data.peso_kg }}" class="w-full bg-[#020617] border border-[#334155] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#10b981]">
            </div>
            <div class="space-y-1">
                <label class="block text-xs font-medium text-[#f4f4f5]">Altura (cm)</label>
                <input type="number" name="altura_cm" required value="{{ user_data.altura_cm }}" class="w-full bg-[#020617] border border-[#334155] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#10b981]">
            </div>
            <div class="space-y-1">
                <label class="block text-xs font-medium text-[#f4f4f5]">Edad</label>
                <input type="number" name="edad" required value="{{ user_data.edad }}" class="w-full bg-[#020617] border border-[#334155] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#10b981]">
            </div>
            <div class="space-y-1">
                <label class="block text-xs font-medium text-[#f4f4f5]">Días de entrenamiento (0-7)</label>
                <input type="number" name="dias_entreno" required value="{{ user_data.dias_entreno }}" min="0" max="7" class="w-full bg-[#020617] border border-[#334155] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#10b981]">
            </div>
            <div class="space-y-1">
                <label class="block text-xs font-medium text-[#f4f4f5]">Objetivo actual</label>
                <select name="objetivo" required class="w-full bg-[#020617] border border-[#334155] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#10b981]">
                    <option value="perdida_agresiva" {% if user_data.objetivo == 'perdida_agresiva' %}selected{% endif %}>Pérdida agresiva (-25%)</option>
                    <option value="perdida_controlada" {% if user_data.objetivo == 'perdida_controlada' %}selected{% endif %}>Pérdida controlada (-15%)</option>
                    <option value="mantenimiento" {% if user_data.objetivo == 'mantenimiento' %}selected{% endif %}>Mantenimiento (0%)</option>
                    <option value="volumen_limpio" {% if user_data.objetivo == 'volumen_limpio' %}selected{% endif %}>Volumen limpio (+10%)</option>
                    <option value="volumen_fuerte" {% if user_data.objetivo == 'volumen_fuerte' %}selected{% endif %}>Volumen fuerte (+20%)</option>
                </select>
            </div>
            <button id="btn-notificaciones" class="btn-primary" style="margin-top: 20px;">
                Activar Notificaciones
            </button>
            <!-- Sección Clave Gemini (El candadito / UX amigable) -->
            <div class="space-y-2 pt-2 border-t border-[#1e293b]">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-bold text-white flex items-center gap-1.5">
                        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                        Gemini API Key Personal
                    </label>
                    <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-[11px] text-emerald-400 hover:underline flex items-center gap-1">
                        Generar Key ↗
                    </a>
                </div>
                <input type="password" name="gemini_api_key" value="{{ user_data.gemini_api_key or '' }}" placeholder="Pegá tu key acá (ej: AIzaSy...)" class="w-full bg-[#020617] border border-[#334155] rounded-xl px-4 py-3 text-white text-xs focus:outline-none focus:border-[#10b981]">
                <p class="text-[10px] text-[#a1a1aa]">Vinculada a tu cuenta. Tocá el link para generar una gratis en 5 segundos y pegala acá.</p>
            </div>

            <button type="submit" class="w-full bg-[#10b981] hover:bg-[#059669] text-slate-950 font-bold py-3.5 rounded-xl transition-all shadow-lg mt-2">
                Actualizar métricas y recalcular
            </button>
        </form>
    </div>
    <script>
// Pega acá tu PUBLIC KEY generada en vapidkeys.com
const VAPID_PUBLIC_KEY = 'ACA_PEGA_TU_PUBLIC_KEY_EXACTA';

// Función para convertir la clave (requisito técnico de los navegadores)
function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
}

document.getElementById('btn-notificaciones').addEventListener('click', async () => {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        alert('Las notificaciones Push no están soportadas en este navegador.');
        return;
    }

    try {
        const registration = await navigator.serviceWorker.ready;
        
        // Pedir permiso al celular/navegador
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
            alert('Permiso denegado para notificaciones.');
            return;
        }

        // Suscribir el dispositivo a Google/Apple Push
        const subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });

        // Enviar la suscripción a nuestro backend en PythonAnywhere
        const response = await fetch('/api/guardar_suscripcion', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(subscription)
        });

        if (response.ok) {
            alert('¡Notificaciones activadas con éxito!');
        } else {
            alert('Error al guardar la suscripción en el servidor.');
        }

    } catch (error) {
        console.error('Error suscribiendo a push:', error);
        alert('Ocurrió un error al activar las notificaciones.');
    }
});
</script>
</body>
</html>
