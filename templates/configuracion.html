<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - Urbinatti Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="config-card">
        <div class="card-header">
            <h1>Configuración General</h1>
            <p>Actualiza tus parámetros físicos, tu objetivo o tu API key de Gemini.</p>
        </div>

        <form action="/configuracion" method="POST">
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="peso_kg">Peso actual (kg)</label>
                    <input type="number" step="0.1" id="peso_kg" name="peso_kg" required value="{{ user_data.peso_kg }}">
                </div>

                <div class="form-group">
                    <label for="altura_cm">Altura (cm)</label>
                    <input type="number" id="altura_cm" name="altura_cm" required value="{{ user_data.altura_cm }}">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" name="edad" required value="{{ user_data.edad }}">
                </div>

                <div class="form-group">
                    <label for="dias_entreno">Días de entreno / sem</label>
                    <input type="number" id="dias_entreno" name="dias_entreno" required value="{{ user_data.dias_entreno }}" min="0" max="7">
                </div>
            </div>

            <div class="form-group full-width">
                <label for="objetivo">Objetivo Nutricional</label>
                <select id="objetivo" name="objetivo" required>
                    <option value="perdida_agresiva" {% if user_data.objetivo == 'perdida_agresiva' %}selected{% endif %}>Pérdida agresiva (-25%)</option>
                    <option value="perdida_controlada" {% if user_data.objetivo == 'perdida_controlada' %}selected{% endif %}>Pérdida controlada (-15%)</option>
                    <option value="mantenimiento" {% if user_data.objetivo == 'mantenimiento' %}selected{% endif %}>Mantenimiento (0%)</option>
                    <option value="volumen_limpio" {% if user_data.objetivo == 'volumen_limpio' %}selected{% endif %}>Volumen limpio (+10%)</option>
                    <option value="volumen_fuerte" {% if user_data.objetivo == 'volumen_fuerte' %}selected{% endif %}>Volumen fuerte (+20%)</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label for="gemini_api_key">Gemini API Key Personal</label>
                <input type="password" id="gemini_api_key" name="gemini_api_key" placeholder="Dejar en blanco para mantener la actual">
            </div>

            <button type="submit" class="submit-btn">
                Guardar Cambios
            </button>
        </form>
    </div>

</body>
</html>
