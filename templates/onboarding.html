<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding - Urbinatti Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#020617] text-[#f4f4f5] min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-[#090d16] border border-[#1e293b] rounded-3xl p-8 space-y-6 shadow-2xl">
        <div class="space-y-1">
            <h1 class="text-xl font-bold text-white">Configuración de Métricas</h1>
            <p class="text-xs text-[#a1a1aa]">Definí tus parámetros físicos iniciales.</p>
        </div>
        <form action="/onboarding" method="POST" class="space-y-4">
            <div class="space-y-1">
                <label class="block text-xs font-medium text-[#f4f4f5]">Peso actual (kg)</label>
                <input type="number" step="0.1" name="peso_kg" required value="70" class="w-full bg-[#020617] border border-[#334155] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#10b981]">
            </div>
            <div class="space-y-1">
                <label class="block text-xs font-medium text-[#f4f4f5]">Altura (cm)</label>
                <input type="number" name="altura_cm" required placeholder="Ej: 175" class="w-full bg-[#020617] border border-[#334155] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#10b981]">
            </div>
            <div class="space-y-1">
                <label class="block text-xs font-medium text-[#f4f4f5]">Edad</label>
                <input type="number" name="edad" required placeholder="Ej: 20" class="w-full bg-[#020617] border border-[#334155] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#10b981]">
            </div>
            <div class="space-y-1">
                <label class="block text-xs font-medium text-[#f4f4f5]">Sexo Biológico</label>
                <select name="sexo" required class="w-full bg-[#020617] border border-[#334155] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#10b981]">
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                </select>
            </div>
            <div class="space-y-1">
                <label class="block text-xs font-medium text-[#f4f4f5]">Días de entreno / sem</label>
                <input type="number" name="dias_entreno" required value="5" min="0" max="7" class="w-full bg-[#020617] border border-[#334155] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#10b981]">
            </div>
            <div class="space-y-1">
                <label class="block text-xs font-medium text-[#f4f4f5]">Objetivo Nutricional</label>
                <select name="objetivo" required class="w-full bg-[#020617] border border-[#334155] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#10b981]">
                    <option value="perdida_agresiva">Pérdida agresiva (-25%)</option>
                    <option value="perdida_controlada" selected>Pérdida controlada (-15%)</option>
                    <option value="mantenimiento">Mantenimiento (0%)</option>
                    <option value="volumen_limpio">Volumen limpio (+10%)</option>
                    <option value="volumen_fuerte">Volumen fuerte (+20%)</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-[#10b981] hover:bg-[#059669] text-slate-950 font-bold py-3.5 rounded-xl transition-all shadow-lg mt-2">
                Siguiente
            </button>
        </form>
    </div>
</body>
</html>
