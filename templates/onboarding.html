<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración Inicial - Urbinatti Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .onboarding-card {
            width: 100%;
            max-width: 550px;
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            padding: 2.5rem;
        }

        .onboarding-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .onboarding-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .onboarding-header p {
            font-size: 0.875rem;
            color: #94a3b8;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            margin-bottom: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1.25rem;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
        }

        input, select {
            width: 100%;
            background-color: #020617;
            border: 1px solid #334155;
            border-radius: 0.50rem;
            padding: 0.75rem 1rem;
            color: #ffffff;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        select option {
            background-color: #0f172a;
            color: #ffffff;
        }

        .submit-btn {
            width: 100%;
            background-color: #4f46e5;
            color: #ffffff;
            font-weight: 600;
            padding: 0.875rem;
            border: none;
            border-radius: 0.50rem;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background-color: #4338ca;
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            .onboarding-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="onboarding-card">
        <div class="onboarding-header">
            <h1>Configuración de Métricas</h1>
            <p>Definí tus parámetros físicos y tu objetivo principal para calibrar el sistema.</p>
        </div>

        <form action="/onboarding" method="POST">
            
            <div class="form-grid">
                <!-- Peso -->
                <div class="form-group">
                    <label for="peso_kg">Peso actual (kg)</label>
                    <input type="number" step="0.1" id="peso_kg" name="peso_kg" required value="70">
                </div>

                <!-- Altura -->
                <div class="form-group">
                    <label for="altura_cm">Altura (cm)</label>
                    <input type="number" id="altura_cm" name="altura_cm" required placeholder="Ej: 175">
                </div>
            </div>

            <div class="form-grid">
                <!-- Edad -->
                <div class="form-group">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" name="edad" required placeholder="Ej: 20">
                </div>

                <!-- Sexo Biológico -->
                <div class="form-group">
                    <label for="sexo">Sexo Biológico</label>
                    <select id="sexo" name="sexo" required>
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                    </select>
                </div>
            </div>

            <div class="form-grid">
                <!-- Días de entrenamiento -->
                <div class="form-group">
                    <label for="dias_entreno">Días de entreno / sem</label>
                    <input type="number" id="dias_entreno" name="dias_entreno" required value="5" min="0" max="7">
                </div>

                <!-- Objetivo -->
                <div class="form-group">
                    <label for="objetivo">Objetivo Nutricional</label>
                    <select id="objetivo" name="objetivo" required>
                        <option value="perdida_agresiva">Pérdida agresiva (-25%)</option>
                        <option value="perdida_controlada" selected>Pérdida controlada (-15%)</option>
                        <option value="mantenimiento">Mantenimiento (0%)</option>
                        <option value="volumen_limpio">Volumen limpio (+10%)</option>
                        <option value="volumen_fuerte">Volumen fuerte (+20%)</option>
                    </select>
                </div>
            </div>

            <!-- Botón de Envío -->
            <button type="submit" class="submit-btn">
                Guardar y Calcular Métricas
            </button>
        </form>
    </div>

</body>
</html>
