<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración Inicial - Urbinatti Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
</head>
<link rel="stylesheet" href="/static/style.css">
<body>

    <div class="onboarding-card">
        <div class="onboarding-header">
            <h1>Configuración de Métricas</h1>
            <p>Definí tus parámetros físicos y tu objetivo principal para calibrar el sistema.</p>
        </div>

        <form action="/onboarding" method="POST">
            
            <div class="form-grid">
                <!-- Peso -->
                <div class="form-group">
                    <label for="peso_kg">Peso actual (kg)</label>
                    <input type="number" step="0.1" id="peso_kg" name="peso_kg" required value="70">
                </div>

                <!-- Altura -->
                <div class="form-group">
                    <label for="altura_cm">Altura (cm)</label>
                    <input type="number" id="altura_cm" name="altura_cm" required placeholder="Ej: 175">
                </div>
            </div>

            <div class="form-grid">
                <!-- Edad -->
                <div class="form-group">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" name="edad" required placeholder="Ej: 20">
                </div>

                <!-- Sexo Biológico -->
                <div class="form-group">
                    <label for="sexo">Sexo Biológico</label>
                    <select id="sexo" name="sexo" required>
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                    </select>
                </div>
            </div>

            <div class="form-grid">
                <!-- Días de entrenamiento -->
                <div class="form-group">
                    <label for="dias_entreno">Días de entreno / sem</label>
                    <input type="number" id="dias_entreno" name="dias_entreno" required value="5" min="0" max="7">
                </div>

                <!-- Objetivo -->
                <div class="form-group">
                    <label for="objetivo">Objetivo Nutricional</label>
                    <select id="objetivo" name="objetivo" required>
                        <option value="perdida_agresiva">Pérdida agresiva (-25%)</option>
                        <option value="perdida_controlada" selected>Pérdida controlada (-15%)</option>
                        <option value="mantenimiento">Mantenimiento (0%)</option>
                        <option value="volumen_limpio">Volumen limpio (+10%)</option>
                        <option value="volumen_fuerte">Volumen fuerte (+20%)</option>
                    </select>
                </div>
            </div>

            <!-- Botón de Envío -->
            <button type="submit" class="submit-btn">
                Guardar y Calcular Métricas
            </button>
        </form>
    </div>

</body>
</html>
