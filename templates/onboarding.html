<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración Inicial - Urbinatti Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold tracking-tight text-white">Configuración de Métricas</h1>
            <p class="text-sm text-slate-400">Definí tus parámetros físicos y tu objetivo principal para calibrar el sistema.</p>
        </div>

        <!-- Formulario de Onboarding -->
        <form action="/onboarding" method="POST" class="space-y-4">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Peso -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Peso actual (kg)</label>
                    <input type="number" step="0.1" name="peso_kg" required value="70"
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                </div>

                <!-- Altura -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Altura (cm)</label>
                    <input type="number" name="altura_cm" required placeholder="Ej: 175"
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Edad -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Edad</label>
                    <input type="number" name="edad" required placeholder="Ej: 20"
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                </div>

                <!-- Sexo Biológico -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Sexo Biológico</label>
                    <select name="sexo" required
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Días de entrenamiento -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Días de entrenamiento / sem</label>
                    <input type="number" name="dias_entreno" required value="5" min="0" max="7"
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                </div>

                <!-- Objetivo -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Objetivo Nutricional</label>
                    <select name="objetivo" required
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                        <option value="perdida_agresiva">Pérdida agresiva (-25%)</option>
                        <option value="perdida_controlada" selected>Pérdida controlada (-15%)</option>
                        <option value="mantenimiento">Mantenimiento (0%)</option>
                        <option value="volumen_limpio">Volumen limpio (+10%)</option>
                        <option value="volumen_fuerte">Volumen fuerte (+20%)</option>
                    </select>
                </div>
            </div>

            <!-- Botón de Envío -->
            <button type="submit" 
                class="w-full mt-6 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-lg shadow-lg transition-all duration-200">
                Guardar y Calcular Métricas
            </button>
        </form>
    </div>

</body>
</html>
